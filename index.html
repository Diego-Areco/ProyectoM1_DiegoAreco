<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paletas Interactivas</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>Paletas Interactivas</h1>
      </header>
      <main class="main">
        <h2>Generador de Paletas</h2>
        <section>
          <label for="paletteSize">Tamaño de la paleta:</label>
          <select id="paletteSize" name="paletteSize">
            <option value="6" selected>6 colores</option>
            <option value="8">8 colores</option>
            <option value="9">9 colores</option>
          </select>
          <label for="colorFormat">Formato de colores:</label>
          <select id="colorFormat" name="colorFormat">
            <option value="rgba">RGBA</option>
            <option value="hsl" selected>HSL</option>
          </select>
          <button id="generatePalette" type="button">Generar Paleta</button>
        </section>
        <section id="paletteContainer" class="palette-container">
          <ul id="paletteList"></ul>
        </section>
        <div role="status" aria-live="polite" class="toast"></div>
      </main>
      <footer class="footer">
        <p>&copy; 2026 Paletas Interactivas. Todos los derechos reservados.</p>
      </footer>
    </div>
    <script src="./js/app.js"></script>
  </body>
</html>
