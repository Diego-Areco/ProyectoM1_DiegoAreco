<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paletas Interactivas</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-brand">
          <svg
            class="header-logo"
            viewBox="0 0 48 48"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="2" y="2" width="20" height="20" rx="6" fill="#e4572e" />
            <rect x="26" y="2" width="20" height="20" rx="6" fill="#f2b134" />
            <rect x="2" y="26" width="20" height="20" rx="6" fill="#3b82f6" />
            <rect x="26" y="26" width="20" height="20" rx="6" fill="#22a06b" />
          </svg>
          <h1>Paletas Interactivas</h1>
        </div>
      </header>
      <main class="main">
        <h2>Generador de Paletas</h2>
        <section id="controls">
          <div>
            <label for="paletteSize" class="form-label"
              >Tamaño de la paleta:</label
            >
            <select id="paletteSize" class="form-control" name="paletteSize">
              <option value="6" selected>6 colores</option>
              <option value="8">8 colores</option>
              <option value="9">9 colores</option>
            </select>
          </div>
          <div>
            <label for="colorFormat" class="form-label"
              >Formato de colores:</label
            >
            <select id="colorFormat" class="form-control" name="colorFormat">
              <option value="rgba">RGBA</option>
              <option value="hsl" selected>HSL</option>
            </select>
          </div>
          <div>
            <button id="generatePalette" type="button">Generar Paleta</button>
          </div>
        </section>
        <section id="paletteContainer" class="palette-container">
          <div class="paletteHeader">
            <h3 class="paletteTitle">Tu paleta de colores</h3>
            <button
              id="addFavorite"
              class="iconBtn"
              type="button"
              title="Agregar a favoritos"
              aria-label="Agregar a favoritos"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 48 48"
                height="48px"
                width="48px"
                fill="#000000"
              >
                <path
                  d="M24,41.95L21.95,40.1q-5.29-4.86-8.74-8.38T7.7,25.42T4.83,20.4T4,15.85q0-4.51 3.03-7.53T14.5,5.3q2.85,0 5.28,1.35T24,10.55q2.1-2.7 4.45-3.98T33.5,5.3q4.45,0 7.48,3.02T44,15.85q0,2.3-0.82,4.55T40.3,25.42t-5.51,6.3T26.05,40.1L24,41.95ZM24,38q5.06-4.65 8.33-7.97t5.19-5.83t2.7-4.46T41,15.86q0-3.31-2.1-5.43T33.51,8.3q-2.58,0-4.77,1.58T25.2,14.3H22.75q-1.3-2.8-3.49-4.4T14.49,8.3q-3.29,0-5.39,2.13T7,15.87q0,1.93 0.78,3.91t2.7,4.5T15.7,30.1T24,38Zm0-14.85Z"
                />
              </svg>
            </button>
          </div>
          <ul id="paletteList"></ul>
        </section>
        <section id="favoritesContainer" class="favorites-container">
          <h3>Paletas Favoritas</h3>
          <ul id="favoritesList" class="favorites-list"></ul>
        </section>
        <div role="status" aria-live="polite" class="toast" id="toast"></div>
      </main>
      <footer class="footer">
        <p>&copy; 2026 Paletas Interactivas. Todos los derechos reservados.</p>
      </footer>
    </div>
    <script src="./js/app.js"></script>
  </body>
</html>
